<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlowGuard · GSC Job-to-Cash control</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230B1F3A'/%3E%3Cpath d='M12 4 6 7v4c0 4 3 7 6 8 3-1 6-4 6-8V7z' fill='none' stroke='white' stroke-width='1.8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --paper:#F5F7FB; --surface:#FFFFFF; --surface-2:#F8FAFD; --ink:#0B1A30; --muted:#566377; --faint:#8793A6;
  --line:#E3E8F0; --line-2:#CDD5E1; --brand:#0B1F3A; --brand-ink:#FFFFFF; --brand-soft:#E9EEF6;
  --ready:#18794E; --ready-soft:#E3F3EA; --review:#9A5B00; --review-soft:#FDF0D8; --blocked:#B42318; --blocked-soft:#FCE6E3;
  --info:#2457C5; --info-soft:#E7EEFB; --ai:#5B3FA6; --ai-soft:#EEEAF8; --focus:#2457C5; --hero:#0B1F3A;
  --r-sm:4px; --r:8px; --r-lg:12px; --shadow:0 1px 2px rgba(11,31,58,.06),0 4px 16px rgba(11,31,58,.07);
  --font:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#081221; --surface:#0E1B2E; --surface-2:#12223A; --ink:#E7EDF6; --muted:#9DABC0; --faint:#6E7D94;
  --line:#1D2D46; --line-2:#2A3D5C; --brand:#F2F5FA; --brand-ink:#0B1F3A; --brand-soft:#1A2C49;
  --ready:#4CC38A; --ready-soft:#0F2A22; --review:#E2A03C; --review-soft:#2C2111; --blocked:#F07060; --blocked-soft:#311512;
  --info:#8DB0F5; --info-soft:#14223F; --ai:#A894EA; --ai-soft:#211A36; --focus:#8DB0F5; --hero:#0B1F3A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#081221; --surface:#0E1B2E; --surface-2:#12223A; --ink:#E7EDF6; --muted:#9DABC0; --faint:#6E7D94;
  --line:#1D2D46; --line-2:#2A3D5C; --brand:#F2F5FA; --brand-ink:#0B1F3A; --brand-soft:#1A2C49;
  --ready:#4CC38A; --ready-soft:#0F2A22; --review:#E2A03C; --review-soft:#2C2111; --blocked:#F07060; --blocked-soft:#311512;
  --info:#8DB0F5; --info-soft:#14223F; --ai:#A894EA; --ai-soft:#211A36; --focus:#8DB0F5; --hero:#0B1F3A; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}  /* author display rules (e.g. label.f{display:flex}) must not un-hide elements */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--info);text-decoration:none} a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
h1{font-size:22px;line-height:1.2;margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 10px;font-weight:650}
h3{font-size:14px;margin:0 0 8px;font-weight:650}
p{margin:0 0 8px} small,.muted{color:var(--muted)} .faint{color:var(--faint)}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{border-color:var(--muted)} .btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)} .btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--blocked);border-color:color-mix(in srgb,var(--blocked) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent} .btn.sm{padding:4px 9px;font-size:13px}
input[type=text],input[type=password],input[type=search],input[type=date],input[type=number],select,textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:550}
label.f>input,label.f>select,label.f>textarea{color:var(--ink);font-size:14px;font-weight:400}

/* shell */
.app{display:grid;grid-template-columns:236px 1fr;height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink)}
.brand b{font-size:15px;letter-spacing:.01em} .brand small{display:block;font-size:11.5px;line-height:1.2}
.nav{padding:4px 8px 16px}
.nav .grp{font-size:11.5px;color:var(--faint);padding:14px 10px 4px;font-weight:600}
.nav a{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:6px;color:var(--ink);font-weight:500}
.nav a:hover{background:var(--surface-2);text-decoration:none}
.nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:650}
.nav a svg{width:16px;height:16px;flex:none;opacity:.75}
.nav .count{margin-left:auto;font-size:11.5px;background:var(--review-soft);color:var(--review);border-radius:10px;padding:0 7px;font-weight:650}
.side-foot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.top .crumbs{font-size:12.5px;color:var(--muted)} .top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);background:var(--surface);white-space:nowrap}
.pill.demo{border-color:color-mix(in srgb,var(--review) 45%,var(--line));color:var(--review);background:var(--review-soft)}
.pill.local{color:var(--ai);border-color:color-mix(in srgb,var(--ai) 35%,var(--line));background:var(--ai-soft)}
.content{overflow:auto;padding:20px 24px 80px;flex:1}
.side .mark,.boot .mark{box-shadow:0 2px 8px rgba(11,31,58,.25)}
.page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-head .sub{color:var(--muted);margin-top:4px;max-width:72ch}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.menu-btn{display:none}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card.flush{padding:0} .card>h2:first-child{margin-bottom:12px}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px} .card-head h2{margin:0} .card-head .r{margin-left:auto}
.grid{display:grid;gap:14px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .stack{display:flex;flex-direction:column;gap:10px}
.sep{height:1px;background:var(--line);margin:12px 0}
.mt{margin-top:14px} .mb{margin-bottom:14px}

/* KPIs */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;cursor:pointer;text-align:left;display:block;width:100%}
.kpi:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:550}
.kpi .v{font-size:24px;font-weight:650;letter-spacing:-.02em;margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.zero{border-color:color-mix(in srgb,var(--ready) 45%,var(--line));background:linear-gradient(0deg,var(--ready-soft),var(--surface) 70%)}
.kpi.zero .v{color:var(--ready)} .kpi.bad{border-color:var(--blocked)} .kpi.bad .v{color:var(--blocked)}
.target{font-size:11.5px;font-weight:650;color:var(--ready);border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:middle}

/* status language: colour + shape so it never relies on colour alone */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;padding:2px 8px 2px 7px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;flex:none}
.st.READY{background:var(--ready-soft);color:var(--ready)} .st.READY::before{background:currentColor;border-radius:50%}
.st.NEEDS_REVIEW{background:var(--review-soft);color:var(--review)} .st.NEEDS_REVIEW::before{border:2px solid currentColor;border-radius:50%;width:6px;height:6px;background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.st.BLOCKED{background:var(--blocked-soft);color:var(--blocked)} .st.BLOCKED::before{background:currentColor;border-radius:1px}
.st.INVOICED{background:var(--info-soft);color:var(--info)} .st.INVOICED::before{background:currentColor;clip-path:polygon(0 50%,40% 100%,100% 0,100% 25%,40% 80%,0 30%)}
.st.neutral{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)} .st.neutral::before{display:none}
.tag{display:inline-block;font-size:11.5px;padding:1px 6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-weight:550;white-space:nowrap}
.tag.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--ink)}
.tag.ai{background:var(--ai-soft);color:var(--ai);border-color:transparent}
.prio{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:4px}
.prio.CRITICAL{background:var(--blocked);color:#fff} .prio.HIGH{background:var(--review-soft);color:var(--review)} .prio.NORMAL{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* tables */
.tbl-wrap{overflow:auto;border-radius:var(--r-lg)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0;white-space:nowrap;z-index:1}
.t th.sortable{cursor:pointer} .t th.sortable:hover{color:var(--ink)}
.t td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr.click{cursor:pointer} .t tbody tr.click:hover td{background:var(--surface-2)}
.t td.num,.t th.num{text-align:right;white-space:nowrap}
.t td.nowrap{white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:12px;border-bottom:1px solid var(--line)}
.filters select,.filters input{padding:6px 8px;font-size:13px}
.pager{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* bars */
.bar-list{display:flex;flex-direction:column;gap:8px}
.bar-item{display:grid;grid-template-columns:minmax(120px,1fr) 2fr auto;gap:10px;align-items:center;cursor:pointer;padding:3px 4px;border-radius:6px}
.bar-item:hover{background:var(--surface-2)}
.bar-track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar-fill{height:100%;background:var(--brand);border-radius:5px}
.leak{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;align-items:center;padding:9px 10px;border-radius:var(--r);border:1px solid var(--line);cursor:pointer;background:var(--surface)}
.leak:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.leak .lv{font-weight:650;text-align:right} .leak .lj{color:var(--muted);text-align:right;font-size:12.5px}

/* money map */
.mm{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:8px 2px 4px}
.mm-col{display:flex;flex-direction:column;gap:10px;justify-content:center;min-width:148px;flex:1}
.mm-node{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.mm-node:hover{box-shadow:var(--shadow);border-color:var(--line-2)}
.mm-node .t1{font-size:12.5px;color:var(--muted);font-weight:600}
.mm-node .t2{font-size:20px;font-weight:650;margin-top:2px;letter-spacing:-.02em}
.mm-node .t3{font-size:12.5px;color:var(--muted)}
.mm-node.context{background:var(--surface-2);border-style:dashed}
.mm-node.ready{border-left:4px solid var(--ready)} .mm-node.review{border-left:4px solid var(--review)} .mm-node.blocked{border-left:4px solid var(--blocked)}
.mm-node.lane{border-color:var(--brand);background:var(--brand-soft)}
.mm-node .leakflag{display:inline-block;margin-top:6px;font-size:11.5px;color:var(--blocked);font-weight:650}
.mm-link{display:flex;align-items:center;width:28px;flex:none}
.mm-link span{display:block;width:100%;background:var(--brand);opacity:.35;border-radius:3px}
.lane-label{font-size:11.5px;font-weight:700;color:var(--brand);padding:0 4px 4px}
.scope-band{display:flex;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px}

/* trace */
.trace{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,1.2fr);gap:14px}
.tl{position:relative;padding-left:4px}
.tl-node{position:relative;display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:7px 10px 7px 4px;border-radius:var(--r);cursor:pointer;border:1px solid transparent;width:100%;background:none;text-align:left}
.tl-node:hover{background:var(--surface-2)} .tl-node.sel{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 30%,transparent)}
.tl-node .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ready);background:var(--surface);justify-self:center;z-index:1}
.tl-node.fail .dot{border-color:var(--blocked);background:var(--blocked)} .tl-node.info .dot{border-color:var(--info)}
.tl-node.ok .dot{background:var(--ready)}
.tl-node:not(:last-child)::after{content:"";position:absolute;left:14px;top:26px;bottom:-12px;width:2px;background:var(--line-2)}
.tl-node .lbl{font-size:12px;color:var(--muted);font-weight:600} .tl-node .val{font-weight:650}
.tl-node .amt{font-weight:650;white-space:nowrap}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word}
.why{font-size:11px;font-weight:700;color:var(--info);border:1px solid color-mix(in srgb,var(--info) 40%,transparent);border-radius:4px;padding:0 5px;cursor:pointer;background:none;margin-left:4px}

/* callouts */
.note{border-radius:var(--r);padding:10px 12px;font-size:13px;border:1px solid var(--line);background:var(--surface-2)}
.note.warn{background:var(--review-soft);border-color:transparent;color:color-mix(in srgb,var(--review) 80%,var(--ink))}
.note.bad{background:var(--blocked-soft);border-color:transparent;color:color-mix(in srgb,var(--blocked) 80%,var(--ink))}
.note.good{background:var(--ready-soft);border-color:transparent;color:color-mix(in srgb,var(--ready) 75%,var(--ink))}
.note.ai{background:var(--ai-soft);border-color:transparent}
.reason{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface)}
.reason+.reason{margin-top:8px}

/* steps */
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px}
.steps .s{padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps .s.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)} .steps .s.done{color:var(--ready);border-color:var(--ready)}

/* toast, modal */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r);z-index:60;box-shadow:var(--shadow);max-width:90vw}
.toast.err{background:var(--blocked);color:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(8,18,33,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:var(--r-lg);max-width:560px;width:100%;padding:18px;box-shadow:var(--shadow);max-height:90vh;overflow:auto}

/* AI bubble */
.ai-fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;background:var(--ai);color:#fff;border:0;cursor:pointer;box-shadow:0 6px 20px rgba(60,40,120,.35);display:grid;place-items:center;z-index:40}
.ai-fab svg{width:24px;height:24px}
.ai-panel{position:fixed;right:22px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:420px;max-width:calc(100vw - 24px);height:min(640px,calc(100vh - 120px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 12px 40px rgba(11,31,58,.2);display:flex;flex-direction:column;z-index:41;overflow:hidden}
.ai-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.ai-head b{font-size:14px}
.ai-gov{display:flex;gap:4px;flex-wrap:wrap;padding:6px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.ai-gov span{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--surface)}
.ai-log{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:9px 11px;border-radius:10px;font-size:13.5px}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink)}
.msg.bot{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line)}
.msg.rejected{background:var(--blocked-soft);border-color:transparent}
.msg .meta{font-size:11px;color:var(--faint);margin-top:6px}
.msg table.t{font-size:12px;margin-top:6px;background:var(--surface)} .msg .t td,.msg .t th{padding:5px 7px}
.ai-chips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:0 14px 8px;scrollbar-width:thin}
.ai-chips button{flex:none}
.ai-chips button{font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 9px;cursor:pointer;color:var(--muted)}
.ai-chips button:hover{color:var(--ink);border-color:var(--line-2)}
.ai-input{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.ai-input input{flex:1}

/* login */
.login{min-height:100%;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr)}
.login-hero{background:var(--hero);background-image:radial-gradient(1200px 500px at 110% -10%,#1C3A66 0,transparent 60%);color:#E6ECF5;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between}
.login-hero h1{font-size:38px;line-height:1.08;max-width:15ch;font-weight:700;letter-spacing:-.03em;color:#fff}
.login-hero .flow{display:flex;flex-direction:column;gap:0;margin:28px 0;max-width:420px}
.login-hero .flow div{display:flex;align-items:center;gap:12px;padding:7px 0;font-size:14px;color:#C3CFE2}
.login-hero .flow div i{width:10px;height:10px;border-radius:50%;border:2px solid #8FA4C4;flex:none}
.login-hero .flow div.k i{background:#fff;border-color:#fff} .login-hero .flow div.k{color:#fff;font-weight:600}
.login-hero .p{font-size:13px;color:#9FB0CC;max-width:52ch}
.login-form{padding:48px;display:flex;flex-direction:column;justify-content:center;gap:14px;background:var(--surface)}
.login-form form{display:flex;flex-direction:column;gap:12px;max-width:380px}
.acct{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;background:var(--surface);text-align:left;width:100%}
.acct:hover{border-color:var(--brand)} .acct b{font-size:13px} .acct small{grid-column:1}

async function aiSend(text) {

  }

      ${(p.payload.modifiers || []).map(m => `<dt>${esc(m.condition.toLowerCase())} modifier</dt><dd>+${gbp(m.client_amount)}</dd>`).join("")}
      ${p.payload.po_required !== null && p.payload.po_required !== undefined ? `<dt>PO</dt><dd>${p.payload.po_required ? "Required" : "Not required"}</dd>` : ""}
      <dt>Impact</dt><dd>${num(s.affected_jobs)} jobs · ${gbp(s.billing_difference)} · ${num(s.ready_to_blocked)} would become blocked</dd>

  return h;
}

/* ---------------------------------------------------------------- shared components */
function kpi(label, value, sub, href, cls = "") {
  return `<button class="kpi ${cls}" onclick="go('${href}')"><div class="l">${label}</div><div class="v">${value}</div>${sub ? `<div class="s">${sub}</div>` : ""}</button>`;
}
function table(cols, rows, { onRow, empty = "Nothing to show", sort, dir } = {}) {
  if (!rows.length) return `<div class="empty"><b>${esc(empty)}</b></div>`;
  return `<div class="tbl-wrap"><table class="t"><thead><tr>${cols.map(c => `<th class="${c.num ? "num " : ""}${c.sort ? "sortable" : ""}" ${c.sort ? `data-sort="${c.sort}"` : ""} scope="col">${esc(c.h)}${c.sort && sort === c.sort ? (dir === "asc" ? " ↑" : " ↓") : ""}</th>`).join("")}</tr></thead>
  <tbody>${rows.map((r, i) => `<tr ${onRow ? `class="click" data-i="${i}" tabindex="0"` : ""}>${cols.map(c => `<td class="${c.num ? "num" : ""} ${c.nowrap ? "nowrap" : ""}">${c.v(r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function bindRows(el, rows, fn) {
  $$("tbody tr.click", el).forEach(tr => {
    const h = () => fn(rows[+tr.dataset.i]);
    tr.onclick = e => { if (!e.target.closest("a,button")) h(); };
    tr.onkeydown = e => { if (e.key === "Enter") h(); };
  });
}
function head(title, sub, actions = "") {
  return `<div class="page-head"><div><h1>${esc(title)}</h1>${sub ? `<div class="sub">${sub}</div>` : ""}</div>${actions ? `<div class="actions">${actions}</div>` : ""}</div>`;
}
const charts = [];
function chart(canvas, cfg) {
  if (!window.Chart) { canvas.replaceWith(Object.assign(document.createElement("div"), { className: "empty", textContent: "Chart library unavailable; figures are listed alongside." })); return; }
  const css = getComputedStyle(document.documentElement);
  Chart.defaults.font.family = css.getPropertyValue("--font"); Chart.defaults.color = css.getPropertyValue("--muted").trim();
  Chart.defaults.borderColor = css.getPropertyValue("--line").trim();
  Chart.defaults.animation = REDUCED ? false : { duration: 800, easing: "easeOutQuart" };
  charts.push(new Chart(canvas, cfg));
}

function jobTable(rows, opt = {}) {
  return table([
    { h: "Job", sort: "id", v: r => `<a href="#/jobs/${r.id}"><b>${esc(r.ref)}</b></a><div class="faint" style="font-size:12px">${esc(r.external_job_id)}</div>` },
    { h: "Client", v: r => esc(r.client || "–") },
    { h: "Agent", v: r => esc(r.agent || "–") },
    { h: "Type", sort: "job_type", v: r => esc(r.job_type || "–") + (r.weekend ? ` <span class="tag">wknd</span>` : "") + (r.emergency ? ` <span class="tag">emerg</span>` : "") + (r.revisit ? ` <span class="tag">revisit</span>` : "") },
    { h: "Date", sort: "job_date", nowrap: 1, v: r => dd(r.job_date) },
    { h: "Verified", v: r => r.verification_status === "VERIFIED" ? `<span class="muted">Verified</span>` : `<span class="st neutral">${esc(r.verification_status.toLowerCase())}</span>` },
    { h: "Status", sort: "status", v: r => st(r.status) },
    { h: "Reason", v: r => r.reasons.map(code).join(" ") || `<span class="faint">–</span>` },
    { h: "Client £", num: 1, sort: "client_net", v: r => r.client_net ? gbp(r.client_net) : `<span class="faint">${r.value_at_stake ? "≤ " + gbp(r.value_at_stake) : "unpriced"}</span>` },
    { h: "Agent £", num: 1, v: r => gbp(r.agent_net) },
    { h: "PO", v: r => esc(r.po_number || "–") },
    { h: "Invoice", v: r => r.invoiced ? `<span class="st INVOICED">${esc(r.client_invoice)}</span>` : r.invoice_status === "AWAITING" ? `<span class="muted">Awaiting</span>` : `<span class="faint">–</span>` },
    { h: "Updated", nowrap: 1, v: r => dt(r.updated_at) },
  ], rows, { onRow: 1, empty: "No jobs match these filters", ...opt });
}

function traceView(trace, holder) {
  let sel = trace.findIndex(n => n.state === "fail"); if (sel < 0) sel = trace.findIndex(n => n.key === "net"); if (sel < 0) sel = 0;
  const draw = () => {
    holder.innerHTML = `<div class="trace"><div class="tl" role="list">${trace.map((n, i) => `
      <button class="tl-node ${n.state} ${i === sel ? "sel" : ""}" data-i="${i}" role="listitem"><span class="dot"></span><span><span class="lbl">${esc(n.label)}</span><br><span class="val">${esc(n.value)}</span></span><span class="amt">${n.detail?.client_amount ? gbp(n.detail.client_amount) : ""}</span></button>`).join("")}</div>
      <div class="card" style="background:var(--surface-2)">${nodeDetail(trace[sel])}</div></div>`;
    $$(".tl-node", holder).forEach(b => b.onclick = () => { sel = +b.dataset.i; draw(); });
  };
  draw();
}
function nodeDetail(n) {
  const d = n.detail || {};
  const rows = Object.entries(d).filter(([, v]) => v !== null && v !== "" && !(Array.isArray(v) && !v.length)).map(([k, v]) => `<dt>${esc(k.replace(/_/g, " "))}</dt><dd>${typeof v === "object" ? `<code>${esc(JSON.stringify(v))}</code>` : /amount|net|gross|margin/.test(k) && !isNaN(+v) ? gbp(v) : esc(v)}</dd>`).join("");
  const ref = n.ref ? `<p class="muted" style="margin-top:10px">Source record: ${code(n.ref)}${n.ref.startsWith("invoice:") ? ` · <a href="#/invoices/${n.ref.split(":")[1]}">open invoice</a>` : n.ref.startsWith("rcv:") ? ` · <a href="#/rate-cards">open rate card</a>` : ""}</p>` : "";
  return `<div class="row"><h3 style="margin:0">${esc(n.label)}</h3>${n.state === "fail" ? `<span class="st BLOCKED">Check failed</span>` : n.state === "ok" ? `<span class="st READY">Passed</span>` : ""}</div>
    <p style="font-size:18px;font-weight:650;margin:6px 0 10px">${esc(n.value)}</p>${rows ? `<dl class="kv">${rows}</dl>` : `<p class="muted">No further detail recorded for this step.</p>`}${ref}`;
}

});

/* ---------------------------------------------------------------- job: price factor values */
function factorValue(f, v) {
  if (v === undefined || v === null || v === "") return `<span class="muted">not recorded</span>`;
  if (f.kind === "BOOLEAN") return v ? "Yes" : "No";
  return esc(v) + (f.kind === "NUMBER" && f.unit ? " " + esc(f.unit) : "");
}
function jobFactorsCard(j) {
  const fs = FG.meta.price_fields || [];
  if (!fs.length) return "";
  const a = j.attributes || {};
  const can = ["SUPER_ADMIN", "FINANCE_ADMIN", "REVIEWER"].includes(FG.user.role) && !j.invoiced;
  const isReq = f => f.required_for.includes("*") || f.required_for.includes(j.job_type);
  return `<div class="card mt"><div class="card-head"><h2>Price factors</h2><span class="muted">Facts about this job that pricing rules can use.</span>
      ${can ? `<button class="btn sm r" id="editFactors">Edit values</button>` : j.invoiced ? `<span class="tag r">Invoiced: values frozen</span>` : ""}</div>
    <dl class="kv">${fs.map(f => `<dt>${esc(f.label)}${isReq(f) ? ` <span class="tag">required</span>` : ""}</dt><dd>${factorValue(f, a[f.key])}${isReq(f) && (a[f.key] === undefined || a[f.key] === null) ? ` <span class="st NEEDS_REVIEW">needed to price this job</span>` : ""}</dd>`).join("")}</dl></div>`;
}
function jobFactorModal(j) {
  const fs = FG.meta.price_fields || [], a = j.attributes || {};
  const input = f => f.kind === "BOOLEAN" ? `<select name="${esc(f.key)}"><option value="">Not recorded</option><option value="yes" ${a[f.key] === true ? "selected" : ""}>Yes</option><option value="no" ${a[f.key] === false ? "selected" : ""}>No</option></select>`
    : f.kind === "CHOICE" ? `<select name="${esc(f.key)}"><option value="">Not recorded</option>${f.choices.map(x => `<option ${a[f.key] === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>`
    : `<input type="number" name="${esc(f.key)}" min="0" step="any" value="${esc(a[f.key] ?? "")}" placeholder="${esc(f.unit || "")}">`;
  modal(`<h2>Price factors for ${esc(j.ref)}</h2><p class="muted" style="font-size:13px">Saving re-prices this job with the deterministic engine. Every change is audited.</p>
    <form id="jf" class="stack">${fs.map(f => `<label class="f">${esc(f.label)}${f.kind === "NUMBER" && f.unit ? ` (${esc(f.unit)})` : ""}${input(f)}</label>`).join("")}
      <label class="f">Where did these values come from?<textarea name="_reason" rows="2" required placeholder="e.g. Agent's site photos, client work order"></textarea></label>
      <div id="jerr"></div><div class="row"><button class="btn primary" type="submit">Save and re-price</button><button class="btn" type="button" data-close>Cancel</button></div></form>`, (m, close) => {
    $("#jf", m).onsubmit = async e => {
      e.preventDefault();
      const fd = Object.fromEntries(new FormData(e.target)), reason = fd._reason; delete fd._reason;
      try {
        const r = await PUT(`/api/jobs/${j.id}/fields`, { values: fd, reason });
        close();
        toast(Object.keys(r.changed).length ? `Saved. Job is now ${STATUS_LABEL[r.status] || r.status}${r.client_net ? " at " + gbp(r.client_net) : ""}.` : "No changes");
        onRoute();
      } catch (err) { $("#jerr", m).innerHTML = errBox(err); }
    };
  });
}

/* ---------------------------------------------------------------- price factors (admin-defined fields) */
const KIND_LABEL = { BOOLEAN: "Yes / no", NUMBER: "Number", CHOICE: "Pick-list" };
const factorByKey = k => (FG.meta.price_fields || []).find(f => f.key === k);
function condLabel(cond) {
  if (!cond || !cond.startsWith("F:")) return esc(cond);
  const [key, choice] = cond.slice(2).split("=");
  const f = factorByKey(key);
  return `<span class="tag">${esc(f ? f.label : key)}${choice ? " = " + esc(choice) : ""}</span>`;
}
function ruleSummary(u, f) {
  const per = f.kind === "NUMBER" ? ` per ${esc(f.unit || "unit")}${u.included_units ? ` over ${u.included_units}` : ""}` : "";
  return `${code(u.rule)} ${u.choice ? esc(u.choice) + ": " : ""}+${gbp(u.client_amount)} client / +${gbp(u.agent_amount)} agent${per} <span class="faint">· ${esc(u.rate_card)}${u.job_type === "*" ? " · all job types" : " · " + esc(u.job_type)}</span>`;
}
function factorCard(rows, can) {
  const live = rows.filter(f => f.status === "ACTIVE");
  return `<div class="card flush mb" id="factors"><div class="card-head" style="padding:14px 16px 0"><h2>Price factors</h2>
      <span class="muted">Anything else that changes a price: parking permit, floors climbed, access type, distance…</span>
      ${can ? `<button class="btn primary sm r" id="addFactor">+ Add price factor</button>` : ""}</div>
    <p class="muted" style="padding:6px 16px 0;font-size:12.5px">Adding a factor changes no price. Prices move only when a pricing rule that uses it is proposed, simulated and approved by a second person. Making a factor <b>required</b> holds jobs without a value for review, never a guess.</p>
    ${rows.length ? table([
      { h: "Factor", v: f => `<b>${esc(f.label)}</b><div class="faint" style="font-size:12px">${code(f.key)}${f.description ? " · " + esc(f.description) : ""}</div>` },
      { h: "Type", v: f => esc(KIND_LABEL[f.kind]) + (f.kind === "NUMBER" && f.unit ? ` <span class="faint">(${esc(f.unit)})</span>` : "") + (f.kind === "CHOICE" ? `<div style="margin-top:3px">${f.choices.map(x => `<span class="tag">${esc(x)}</span>`).join(" ")}</div>` : "") },
      { h: "Required for", v: f => !f.required_for.length ? `<span class="muted">Optional</span>` : f.required_for.includes("*") ? "All job types" : f.required_for.map(code).join(" ") },
      { h: "Pricing rules in force", v: f => f.rules.length ? f.rules.map(u => `<div style="font-size:12.5px">${ruleSummary(u, f)}</div>`).join("") : `<span class="muted">None yet</span>` },
      { h: "Status", v: f => f.status === "ACTIVE" ? `<span class="st READY">Active</span>` : `<span class="st neutral">Retired</span>` },
      { h: "", v: f => can && f.status === "ACTIVE" ? `<div class="row" style="flex-wrap:nowrap"><a class="btn sm primary" href="#/configuration/new?factor=${encodeURIComponent(f.key)}">Add pricing rule</a><button class="btn sm" data-edit="${esc(f.key)}">Edit</button>${f.rules.length ? "" : `<button class="btn sm danger" data-retire="${esc(f.key)}">Retire</button>`}</div>` : "" }],
      [...live, ...rows.filter(f => f.status !== "ACTIVE")]) :
      `<div class="empty"><b>No price factors yet</b>${can ? "Add one when something other than job type, weekend, emergency or revisit changes the price." : ""}</div>`}</div>`;
}
function bindFactorCard(c, rows) {
  $("#addFactor", c) && ($("#addFactor", c).onclick = () => factorModal(null));
  $$("[data-edit]", c).forEach(b => b.onclick = () => factorModal(rows.find(f => f.key === b.dataset.edit)));
  $$("[data-retire]", c).forEach(b => b.onclick = () => modal(`<h2>Retire ${esc(b.dataset.retire)}?</h2><p class="muted">Jobs keep their recorded values for history. A retired factor can no longer be used in new rules.</p>
      <label class="f">Reason<textarea id="rr" rows="2" required></textarea></label><div id="rerr"></div><div class="row mt"><button class="btn danger" id="rgo">Retire</button><button class="btn" data-close>Cancel</button></div>`, (m, close) => {
    $("#rgo", m).onclick = async () => { try { await POST(`/api/fields/${b.dataset.retire}/retire`, { reason: $("#rr", m).value }); close(); FG.meta = await GET("/api/meta"); toast("Price factor retired"); onRoute(); } catch (e) { $("#rerr", m).innerHTML = errBox(e); } };
  }));
}
function factorModal(f) {
  const req = f ? f.required_for : [];
  const mode = !req.length ? "none" : req.includes("*") ? "all" : "some";
  modal(`<h2>${f ? "Edit price factor" : "Add a price factor"}</h2>
    <p class="muted" style="font-size:13px">A price factor is a fact about a job that can change its price. After saving, add a pricing rule that says how much it changes the price.</p>
    <form id="ff" class="stack">
      <label class="f">Name<input type="text" name="label" required maxlength="80" value="${esc(f?.label || "")}" placeholder="e.g. Floors climbed"></label>
      <label class="f">Type<select name="kind" ${f ? "disabled" : ""}>${Object.entries(KIND_LABEL).map(([k, l]) => `<option value="${k}" ${f?.kind === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <label class="f" data-for="CHOICE">Options (comma separated)<input type="text" name="choices" value="${esc((f?.choices || []).join(", "))}" placeholder="Standard, Gated estate, High rise"></label>
      <label class="f" data-for="NUMBER">Unit<input type="text" name="unit" maxlength="24" value="${esc(f?.unit || "")}" placeholder="e.g. floors, miles, hours"></label>
      <fieldset style="border:1px solid var(--line);border-radius:var(--r);padding:10px 12px"><legend class="muted" style="font-size:12.5px;padding:0 4px">Must every job have a value?</legend>
        <label class="row" style="gap:6px"><input type="radio" name="req" value="none" ${mode === "none" ? "checked" : ""}> Optional (no value means it does not apply)</label>
        <label class="row" style="gap:6px"><input type="radio" name="req" value="all" ${mode === "all" ? "checked" : ""}> Required for all job types</label>
        <label class="row" style="gap:6px"><input type="radio" name="req" value="some" ${mode === "some" ? "checked" : ""}> Required for selected job types</label>
        <div id="jts" class="row" style="margin:6px 0 0 22px;gap:4px 12px">${FG.meta.job_types.map(t => `<label class="row" style="gap:4px;font-size:12.5px"><input type="checkbox" name="jt" value="${esc(t.code)}" ${req.includes(t.code) ? "checked" : ""}>${esc(t.code)}</label>`).join("")}</div></fieldset>
      <label class="f">Description (optional)<textarea name="description" rows="2">${esc(f?.description || "")}</textarea></label>
      <div id="ferr"></div>
      <div class="row"><button class="btn primary" type="submit">${f ? "Save changes" : "Add price factor"}</button><button class="btn" type="button" data-close>Cancel</button></div>
    </form>`, (m, close) => {
    const form = $("#ff", m);
    const sync = () => {
      const kind = form.kind.value;
      $$("[data-for]", m).forEach(x => x.hidden = x.dataset.for !== kind);
      $("#jts", m).hidden = form.querySelector("[name=req]:checked").value !== "some";
    };
    form.onchange = sync; sync();
    form.onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(form), r = fd.get("req");
      const data = { label: fd.get("label"), kind: form.kind.value, choices: fd.get("choices") || "", unit: fd.get("unit") || "",
        description: fd.get("description") || "", required_for: r === "all" ? ["*"] : r === "some" ? fd.getAll("jt") : [] };
      try {
        const res = f ? await PUT(`/api/fields/${f.key}`, data) : await POST("/api/fields", data);
        close(); FG.meta = await GET("/api/meta");
        const held = res.effect ? res.effect.counts.NEEDS_REVIEW : null;
        toast(f ? "Price factor saved" : `Added "${res.field.label}". Next: add a pricing rule for it.` + (held !== null ? ` ${num(res.effect.changed)} job decisions changed.` : ""));
        onRoute();
      } catch (err) { $("#ferr", m).innerHTML = errBox(err); }
    };
  });
}
function factorRow(pre = {}) {
  const fs = FG.meta.price_fields || [];
  return `<div class="adj grid" style="grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 110px 110px 110px 34px;gap:8px;align-items:end">
    <label class="f">Price factor<select name="f_key">${fs.map(f => `<option value="${esc(f.key)}" ${pre.factor === f.key ? "selected" : ""}>${esc(f.label)}</option>`).join("")}</select></label>
    <label class="f f-choice">When it is<select name="f_choice"></select></label>
    <label class="f"><span class="f-cl">Client +£</span><input type="number" name="f_client" step="0.01" min="0" required></label>
    <label class="f"><span class="f-ag">Agent +£</span><input type="number" name="f_agent" step="0.01" min="0" value="0"></label>
    <label class="f f-inc">First N free<input type="number" name="f_inc" step="1" min="0" value="0"></label>
    <button type="button" class="btn ghost sm f-del" aria-label="Remove adjustment" title="Remove">✕</button></div>`;
}
function bindFactorRow(row) {
  const sync = () => {
    const f = factorByKey($("[name=f_key]", row).value); if (!f) return;
    const ch = $("[name=f_choice]", row), wrap = $(".f-choice", row);
    wrap.style.visibility = f.kind === "CHOICE" ? "visible" : "hidden";
    if (f.kind === "CHOICE") { const keep = ch.value; ch.innerHTML = f.choices.map(x => `<option ${x === keep ? "selected" : ""}>${esc(x)}</option>`).join(""); }
    else ch.innerHTML = `<option value="">${f.kind === "BOOLEAN" ? "Yes" : "any value"}</option>`;
    const u = f.unit || "unit";
    $(".f-inc", row).style.visibility = f.kind === "NUMBER" ? "visible" : "hidden";
    $(".f-cl", row).textContent = f.kind === "NUMBER" ? `Client £ per ${u}` : "Client +£";
    $(".f-ag", row).textContent = f.kind === "NUMBER" ? `Agent £ per ${u}` : "Agent +£";
  };
  $("[name=f_key]", row).onchange = sync;
  $(".f-del", row).onclick = () => leave(row, 0);
  sync();
}

const propStatus = s => ({ ACTIVE: `<span class="st READY">Active</span>`, PENDING_APPROVAL: `<span class="st NEEDS_REVIEW">Awaiting approval</span>`, BLOCKED_CONFLICT: `<span class="st BLOCKED">Rule conflict</span>`, REJECTED: `<span class="st neutral">Rejected</span>` }[s] || esc(s));

function simView(s) {
  return `<div class="grid g4">${[["Affected jobs", num(s.affected_jobs)], ["Billing difference", gbp(s.billing_difference)], ["Status changes", num(s.status_changes)], ["Issued invoices that would differ", num(s.historical_invoices_affected)]].map(([l, v]) => `<div class="card" style="padding:12px"><div class="muted" style="font-size:12.5px">${l}</div><div style="font-size:20px;font-weight:650">${v}</div></div>`).join("")}</div>
   <dl class="kv mt"><dt>READY → NEEDS REVIEW</dt><dd>${s.ready_to_review}</dd><dt>NEEDS REVIEW → READY</dt><dd>${s.review_to_ready}</dd><dt>READY → BLOCKED</dt><dd>${s.ready_to_blocked ?? 0}</dd><dt>BLOCKED → READY</dt><dd>${s.blocked_to_ready ?? 0}</dd>
   <dt>Rule conflicts</dt><dd>${s.conflicts.length ? s.conflicts.map(x => `<div class="note bad" style="margin-bottom:4px">${code(x.code)} ${esc(x.detail)}</div>`).join("") : "0"}</dd>
   <dt>New versions</dt><dd>${(s.new_versions || []).map(v => `${esc(v.rate_card)} v${v.version} (${dd(v.valid_from)} – ${v.valid_to ? dd(v.valid_to) : "open"})`).join("<br>") || "–"}</dd></dl>
   ${s.historical_invoices_affected ? `<div class="note warn mt">${esc(s.historical_note)} Affected: ${s.historical_invoice_numbers.map(code).join(" ")}</div>` : ""}
   ${s.examples?.length ? `<h3 class="mt">Example changes</h3>${table([{ h: "Job", v: e => `<a href="#/jobs/${e.job_id}">${esc(e.ref)}</a>` }, { h: "Date", v: e => dd(e.date) }, { h: "Before", v: e => `${st(e.before)} ${gbp(e.before_amount)}` }, { h: "After", v: e => `${st(e.after)} ${gbp(e.after_amount)}` }], s.examples)}` : ""}`;
}

route("/configuration/new", async (c, _, q) => {
  FG.meta = await GET("/api/meta");

  c.innerHTML = head("New configuration proposal", "Nothing here is activated. You will see the conflict check and impact simulation before anything is submitted for approval.") + `
  <div class="grid g-main"><form class="card stack" id="pf">
    <div class="grid g2"><label class="f">Client<select name="client_code">${m.clients.map(x => `<option value="${x.code}">${esc(x.name)}</option>`).join("")}</select></label>
    <label class="f">Job type<select name="job_type"><option value="*" ${preFactor ? "selected" : ""}>All job types (adjustments only)</option>${m.job_types.map(x => `<option ${!preFactor && x === m.job_types[0] ? "selected" : ""}>${x.code}</option>`).join("")}</select></label>
    <label class="f">New client rate (£)<input type="number" name="client_amount" step="0.01" min="0" placeholder="leave blank to keep"></label>

    <label class="f">Weekend uplift (£, optional)<input type="number" name="weekend" step="0.01" min="0"></label>
    <label class="f">Emergency uplift (£, optional)<input type="number" name="emergency" step="0.01" min="0"></label></div>
    <div class="sep"></div>
    <div class="row"><h3 style="margin:0">Price factor adjustments</h3><span class="muted" style="font-size:12.5px">Add to the price when a job's factor matches. ${m.price_fields.length ? "" : `No price factors yet: <a href="#/configuration">add one</a>.`}</span>
      ${m.price_fields.length ? `<button type="button" class="btn sm r" id="addAdj" style="margin-left:auto">+ Add adjustment</button>` : ""}</div>
    <div id="adjs" class="stack"></div>
    <label class="row" style="gap:6px"><input type="checkbox" name="close_previous" checked> Close the version currently in force (untick to see conflict detection)</label>

  $("#addAdj") && ($("#addAdj").onclick = () => addAdj({}));

/* ---------------------------------------------------------------- pay-run invoicing */
function isoDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function payRunModal(el) {
  const bd = new Date(FG.meta.business_date + "T00:00:00");
  const cutoff = isoDate(new Date(bd.getFullYear(), bd.getMonth(), 0));
  modal(`<h2>Generate invoices</h2><p class="muted" style="font-size:13px">One client invoice per client and one agent invoice (self-bill or purchase record) per payee. Only READY jobs are included; the database prevents any job being invoiced twice.</p>
    <form id="pr" class="stack">
      <label class="row" style="gap:6px"><input type="checkbox" name="use_cutoff" checked> Pay-run cut-off: only work verified on or before</label>
      <input type="date" name="verified_by" value="${cutoff}" style="margin-left:22px">
      <div class="grid g2"><label class="f">Client invoice date<input type="date" name="issue_date" value="${cutoff}" required></label>
      <label class="f">Agent invoice / pay date<input type="date" name="agent_issue_date" value="${FG.meta.business_date}" required></label></div>
      <p class="faint" style="font-size:12px;margin:0">${num(el.jobs)} READY jobs in total (${gbp(el.client_net)} client net). Jobs verified after the cut-off stay READY for the next run.</p>
      <div id="prErr"></div><div class="row"><button class="btn primary" type="submit">Generate</button><button class="btn" type="button" data-close>Cancel</button></div></form>`, (m, close) => {
    const f = $("#pr", m);
    f.use_cutoff.onchange = () => { f.verified_by.disabled = !f.use_cutoff.checked; };
    f.onsubmit = async e => {
      e.preventDefault();
      const btn = f.querySelector("[type=submit]"); btn.disabled = true;
      try {
        const g = await POST("/api/invoices/generate", { verified_by: f.use_cutoff.checked ? f.verified_by.value : null, issue_date: f.issue_date.value, agent_issue_date: f.agent_issue_date.value });
        close(); toast(`${g.batch}: ${g.invoices} invoices for ${num(g.expected.ready_jobs)} jobs. Reconciliation mismatches: ${g.reconciliation_mismatches}.`); go("#/invoices?batch_id=" + g.batch_id);
      } catch (err) { $("#prErr", m).innerHTML = errBox(err); btn.disabled = false; }
    };
  });
}

function businessDateCard() {
  return `<div class="card mt"><h2>Business date</h2><p class="muted">The date FlowGuard treats as "today" for checks like "job date in the future". Leave it on today's date for day-to-day work; fix it to close or re-run a past period, or to process work dated later than today.</p>

function bindBusinessDate(c) {

function userModal() {
  const roles = [["FINANCE_ADMIN", "Finance Admin: invoices, configuration proposals and approvals"], ["REVIEWER", "Reviewer: decides exceptions"],
    ["AUDITOR", "Auditor: read-only"], ["SUPER_ADMIN", "Super Admin: users and system settings"], ["AGENT", "Agent: own jobs and invoices only"]];

    <label class="f" id="agWrap" hidden>Agent (the supplier this login belongs to)<select name="agent_code"><option value="">Choose an agent…</option>${(FG.meta.agents || []).map(a => `<option value="${esc(a.code)}">${esc(a.code)} · ${esc(a.name)}</option>`).join("")}</select></label>
    <label class="f">Temporary password<input type="text" name="password" required minlength="12" value="${esc(tempPassword())}"></label>
    <p class="faint" style="font-size:12px;margin:0">Share it securely; they can change it under Settings (staff) or Profile (agents).</p>
    <div id="uerr2"></div><div class="row"><button class="btn primary" type="submit">Create user</button><button class="btn" type="button" data-close>Cancel</button></div></form>`, (m, close) => {

function tempPassword() {
  const a = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789", r = new Uint32Array(16); crypto.getRandomValues(r);
  let p = Array.from(r, x => a[x % a.length]).join("");
  return /[a-z]/.test(p) && /[A-Z]/.test(p) && /\d/.test(p) ? p : tempPassword();
}
